# ═══════════════════════════════════════════════════════════════════
# Biblioteca de movimento — nomes disponíveis no motor (deck.css)
# Uso: <el data-in style="--anim: NOME; --d: atraso; --dur: duração">
# ═══════════════════════════════════════════════════════════════════

entrances:
  rise:     { efeito: "Sobe 40px saindo do desfoque", uso: "Padrão para texto", dur: "1.1s" }
  fade:     { efeito: "Só opacidade", uso: "Rodapés, metadados, coisas secundárias", dur: "0.8-1.1s" }
  pop:      { efeito: "Escala 0.4 → 1.12 → 1", uso: "Operadores (+, =), ícones pequenos, selos", dur: "0.8s" }
  slide-l:  { efeito: "Entra da esquerda com desfoque", uso: "Coluna de texto à esquerda", dur: "1.1s" }
  slide-r:  { efeito: "Entra da direita com desfoque", uso: "Coluna à direita", dur: "1.1s" }
  zoom-in:  { efeito: "Escala 0.92 → 1 com desfoque", uso: "Painéis e blocos grandes", dur: "1.1-1.3s" }
  zoom-out: { efeito: "Escala 1.15 → 1 com desfoque", uso: "Número gigante, logo completo", dur: "1.4-1.8s" }
  card-in:  { efeito: "Sobe 60px + escala 0.96", uso: "Cards (automático em .card)", dur: "1s" }
  flip-in:  { efeito: "Gira no eixo X a partir da base", uso: "Placas, itens de lista com personalidade", dur: "1s" }
  mask-up:  { efeito: "Revela de baixo para cima por máscara", uso: "Títulos grandes, efeito editorial", dur: "1s" }
  wipe:     { efeito: "Revela da esquerda para a direita", uso: "Linhas, barras, sublinhados", dur: "0.8-1.2s" }

special:
  icon-in:   "Símbolo do logo girando em 3D com brilho (automático em .logo-lockup .icon)"
  word-in:   "Assinatura do logo subindo por trás de máscara (automático)"
  shine:     "Brilho passando pelo logo; shine-loop repete a cada 7s"
  draw:      "Desenho de traço SVG (automático em .arrow path)"
  decide:    "Resultado de equação: cresce, explode em brilho, assenta (automático em .term.result)"
  ring:      "Anel pulsando em volta do resultado (loop)"
  screen-in: "Tela/mockup entrando em perspectiva 3D (automático em .screen)"
  scan:      "Linha de varredura passando pela tela (automático)"
  spark:     "Partículas subindo (automático em .sparks)"
  grow:      "Barra da linha do tempo crescendo"
  blink:     "Ponto 'ao vivo' piscando devagar (.chip.live, .panel-top .lbl)"

text:
  data-words: "Quebra o texto em palavras; cada uma entra com --anim e --stagger (padrão .08s)"

transitions:
  fade: "Padrão. Dissolve 0.9s"
  zoom: "Novo slide entra levemente maior e assenta (abertura → conteúdo)"
  push: "Entra deslizando da direita (sequências)"
  cut:  "Corte seco (demos ao vivo, vídeo)"

timing_guide:
  stagger_irmaos: "0.15-0.25s"
  entre_blocos: "0.4-0.6s"
  auto_total_max: "5s"
  heroi_max: "1.6s"
  ease: "--ease-out (cubic-bezier(.16,1,.3,1)) para entradas; --ease para transições"
